[package]
name = "gray-study"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "gray tutors YOU: /study starts a Socratic-tutor session, study_quiz asks via host/ask, study_deck keeps SM-2-lite flashcards."

[[bin]]
name = "gray-study"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
